name: ci

# Build the toolkit + smoke + unit tests on every push and PR. Catches the kind
# of correctness regressions surfaced in the PR #1 review (inverted lerp,
# self-recursive operators, transposed matmul) automatically.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref so rapid pushes don't queue redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev

      - name: Configure
        # imgui is pulled by FetchContent; nlohmann_json is satisfied by the
        # installed package (find_package), matching smoke/CMakeLists.txt.
        run: cmake -S smoke -B build -DIMTOOL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run
        run: ./build/imtool_smoke

  # Compile + link the Application layer (imtool_app) and the examples — the exact
  # GLFW + OpenGL3 + ImGui-backends path a consumer ships via the bootstrap scaffold.
  # The default build-test job leaves IMTOOL_BUILD_APP OFF, so without this job a
  # regression in application.cpp or the backend/link wiring would ship undetected
  # and only break at a consumer's first build. Build-only (no display needed).
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev libglfw3-dev libgl1-mesa-dev

      - name: Configure (with Application + examples)
        run: cmake -S smoke -B build-app -DIMTOOL_SMOKE_WITH_APP=ON -DIMTOOL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-app -j

      - name: Test
        run: ctest --test-dir build-app --output-on-failure

name: ci

# Build the toolkit + smoke + unit tests on every push and PR. Catches the kind
# of correctness regressions surfaced in the PR #1 review (inverted lerp,
# self-recursive operators, transposed matmul) automatically.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref so rapid pushes don't queue redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev

      - name: Configure
        # imgui is pulled by FetchContent; nlohmann_json is satisfied by the
        # installed package (find_package), matching smoke/CMakeLists.txt.
        run: cmake -S smoke -B build -DIMTOOL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run
        run: ./build/imtool_smoke
